[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classin-exporter"
version = "0.4.0"
description = "A Qt desktop exporter for the current ClassIn session"
authors = [{name = "3093FengMing"}]
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "PySide6>=6.8,<7",
    "imageio-ffmpeg>=0.6,<1",
    "pefile>=2024.8.26",
    "capstone>=5,<6",
    "cryptography>=43",
]

[project.gui-scripts]
classin-exporter = "classin_exporter.gui:main"

[tool.setuptools.packages.find]
include = ["classin_exporter*"]
